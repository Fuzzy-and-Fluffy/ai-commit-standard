<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Commit Standard social preview</title>
  <desc id="desc">A light-blue verified Git commit mark beside the project name and practical commit-standard description.</desc>

  <rect width="1280" height="640" fill="#F6F8FA"/>
  <rect x="40" y="40" width="1200" height="560" rx="48" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="4"/>

  <rect x="112" y="176" width="288" height="288" rx="72" fill="#54AEFF"/>
  <path d="M156 320h200" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="320" r="68" fill="#54AEFF" stroke="#FFFFFF" stroke-width="18"/>
  <path d="m224 320 22 23 44-49" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="472" y="270" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700">AI Commit Standard</text>
  <text x="472" y="342" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31">Practical, enforceable and reusable commits</text>
  <text x="472" y="390" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31">for AI-assisted and vibe coding projects.</text>

  <rect x="472" y="430" width="174" height="52" rx="26" fill="#DDF4FF"/>
  <text x="559" y="465" text-anchor="middle" fill="#0969DA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600">Deterministic</text>
  <rect x="664" y="430" width="145" height="52" rx="26" fill="#DDF4FF"/>
  <text x="736.5" y="465" text-anchor="middle" fill="#0969DA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600">Evidence</text>
  <rect x="827" y="430" width="180" height="52" rx="26" fill="#DDF4FF"/>
  <text x="917" y="465" text-anchor="middle" fill="#0969DA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600">Agent-ready</text>
</svg>
